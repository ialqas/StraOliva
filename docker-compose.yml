services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      - DB_PATH=/data/strava.db
      - STRAVA_CLIENT_ID=${STRAVA_CLIENT_ID}
      - STRAVA_CLIENT_SECRET=${STRAVA_CLIENT_SECRET}
      # Analytics settings from .env — without these the container falls back to
      # auto-detect/defaults and computes different TSS than configured.
      - FTP_W=${FTP_W:-0}
      - THRESHOLD_PACE_MS=${THRESHOLD_PACE_MS:-0}
      - REST_HR=${REST_HR:-40}
      - MAX_HR=${MAX_HR:-0}
      # Wind page cities, "Name:lat:lng" comma-separated (empty = per-segment wind)
      - WIND_CITIES=${WIND_CITIES:-}
      # Browser origin(s) allowed to call the API. Set to your dashboard URL
      # (e.g. http://192.168.1.50:3000) or "*" on a trusted LAN.
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      # MCP server is served over Streamable HTTP at /mcp (1=on, 0=off).
      - MCP_HTTP_ENABLED=${MCP_HTTP_ENABLED:-1}
      # Hosts (besides localhost) that MCP clients may use to reach /mcp, e.g.
      # "192.168.1.50:*". Needed when connecting from another machine.
      - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:-}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle at build time — must point at where the
        # BROWSER reaches the backend (your server's IP:8000 in prod).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
