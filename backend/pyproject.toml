[project]
name = "straoliva-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "python-fitparse>=1.2.0",
    "gpxpy>=1.6.0",
    "fastmcp>=2.0.0",
    # app/mcp_server/server.py uses the FastMCP 1.x API bundled in the low-level
    # `mcp` package (mcp.server.fastmcp). mcp 2.x renamed it to MCPServer and
    # changed the app/session-manager surface, so keep the transitive pin here
    # until that code is migrated.
    "mcp<2",
    "apscheduler>=3.10.0",
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
strava-dash = "app.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
